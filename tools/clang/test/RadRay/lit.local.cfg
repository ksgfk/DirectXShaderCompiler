import os
import platform

# The fork extension is currently implemented only on Windows.
if platform.system() != 'Windows' or not config.radray or not config.spirv:
    config.unsupported = True
else:
    probe = os.path.join(config.llvm_tools_dir, 'radray_wire_probe.exe')
    config.substitutions.append(('%radray_probe', '"' + probe + '"'))
